[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-bluetooth-game-control"
version = "0.1.0"
description = "Stream gamepad input from remote PCs to a Linux server that emulates Bluetooth game controllers"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies needed by BOTH sides. Kept deliberately small -- every
# import on the datapath is latency we pay for.
dependencies = [
    "PyNaCl>=1.5.0",       # libsodium: ChaCha20-Poly1305 AEAD + Argon2id
]

[project.optional-dependencies]
# Client-only. SDL2 for gamepad input, Qt for the GUI.
client = [
    "PySDL2>=0.9.16",
    "pysdl2-dll>=2.30.0",  # ships prebuilt SDL2 binaries; makes PyInstaller trivial
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "numpy>=1.26",         # pyqtgraph dependency; also used for latency percentiles
    "av>=13.0",            # decoding the video stream; see the `video` extra
]

# Video capture and encoding. PyAV bundles FFmpeg in its wheels, so this is one
# dependency rather than a system FFmpeg install -- which matters for the
# Windows build, where there is nothing to install against.
#
# The whole encode path assumes this wheel ships libx264 and libopus. Verify
# with `python -m videoserver.main --list-devices -v`, which logs the encoders
# it found; tests/test_videoserver_pipeline.py asserts it too.
video = [
    "av>=13.0",
]

# Server-only. Linux/Raspberry Pi.
server = [
    "aiohttp>=3.9.0",
    "dbus-next>=0.2.3",    # async D-Bus for BlueZ ProfileManager1
    "pyudev>=0.24.0",      # hot-plug detection for BT dongles
    "cryptography>=42.0",  # TLS certificate generation for the web GUI
]

# Rendezvous broker. Deliberately dependency-free beyond the core so it can run
# on the smallest possible VPS.
broker = []

dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pyinstaller>=6.3",
]

# The Linux build host only. Nuitka compiles to C, so it belongs on the machine
# producing the AppImage and nowhere else -- it is not a runtime dependency of
# anything and pulls a toolchain with it.
#
# Windows keeps PyInstaller; Linux uses Nuitka. That is deliberate rather than
# an inconsistency: Nuitka's --standalone output is already the shape an AppDir
# wants, where PyInstaller's onedir layout has to be repackaged.
linux-build = [
    "nuitka>=2.4",
    "ordered-set>=4.1",
    "zstandard>=0.22",
]

[project.scripts]
rbgc-client = "client.main:main"
rbgc-server = "server.main:main"
rbgc-broker = "rendezvous.broker:main"
rbgc-video = "videoserver.main:main"

[tool.setuptools]
# The asset packages are listed too: they hold the icons and controller art,
# which an installed copy needs at runtime. Without them `pip install` produces
# an app that starts and then cannot draw itself.
# Kept complete by tests/test_packaging_manifest.py -- setuptools takes this
# list literally, so a subpackage omitted here is simply absent from an
# installed copy, and the failure is an ImportError on somebody else's machine.
packages = ["common", "common.design",
            "client", "client.input", "client.net", "client.gui",
            "client.gui.assets", "client.gui.panels", "client.media",
            "qtui", "qtui.assets",
            "server", "server.bt", "server.bt.ble", "server.bt.profiles",
            "server.web",
            "rendezvous", "videoserver", "videoserver.assets", "tools"]

[tool.setuptools.package-data]
"client.gui.assets" = ["*.ico", "*.png", "*.svg", "controllers/*.svg", "presets/*.json"]
"videoserver.assets" = ["*.ico", "*.png", "*.svg"]
# The Qt stylesheet loads these two off disk; QSS `image:` takes a path, not a
# data URI, so they cannot travel inside the module the way the icons do.
"qtui.assets" = ["*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
