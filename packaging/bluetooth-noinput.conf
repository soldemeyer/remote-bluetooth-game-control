# systemd drop-in that disables bluetoothd's input plugin.
#
# REQUIRED for Bluetooth HID emulation. The input plugin claims the HID role
# for itself, so our L2CAP binds on PSM 17/19 fail with EADDRINUSE -- which
# looks like a permissions problem and sends people down the wrong path.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/bluetooth.service.d
#   sudo cp packaging/bluetooth-noinput.conf \
#           /etc/systemd/system/bluetooth.service.d/rbgc.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart bluetooth
#
# Verify:
#   systemctl show bluetooth.service -p ExecStart | grep noplugin
#
# Trade-off: with the input plugin disabled, this machine can no longer act as
# a Bluetooth HID *host* -- you cannot pair a Bluetooth keyboard or mouse to
# the Pi itself. That is normally fine for a headless server, but worth knowing
# before you do this on a desktop.
#
# The bluetoothd path differs between distributions. If the service fails to
# start, find yours with:  find /usr -name bluetoothd -type f

[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input

# Debian/Ubuntu on some releases use this path instead:
# ExecStart=/usr/lib/bluetooth/bluetoothd --noplugin=input
